<script type="application/json" id="qa-fb">[["日期", "洪老師提問", "秉澔回答與心得", "備註/關鍵字"], ["2026-05-12", "專題都是買現成的成品組裝，這樣有實驗的精神嗎？", "我覺得「實驗精神」不一定要從零開始做。買來的雷達模組只是硬體，就像小車的眼睛；但是要怎麼看、看到之後要做什麼，是我們自己用 MakeCode 的 Python 寫程式教它的，小車才會算距離、會閃、會停下來等。", "主題：研究方向"], ["2026-05-12", "光學雷達原理是什麼？有辦法自己做嗎？", "光學雷達用的是「飛行時間」（ToF）的方法。它會射出看不見的光，光碰到東西彈回來，雷達算光來回花了多少時間，就知道東西有多遠。很像蝙蝠在晚上聽回音找路，只是把「聲音」換成「看不見的光」。\n雷達本身我們沒辦法自己做，但是我們可以自己寫程式，用一樣的原理去算距離。", "主題：感測原理"], ["2026-05-15", "光學雷達跟 超音波有什麼一樣的地方？", "它們都是靠「反射」來算距離！一個用「光」，一個用「聲音」，東西射出去、彈回來，再算花了多少時間，原理是一樣的。", "主題：感測原理"], ["2026-05-15", "光學雷達和超音波的耗電比較?", "1. 我們之前寫錯了，寫成另一顆雷達（VL53L0X）的資料。我們真正用的是 DFRobot 的 8×8 光學雷達（SEN0628）。它和超音波各用多少電，我們還要再查規格，或用電表量量看，量好再補上。\n2. 如果是真的汽車，超音波比光學雷達省電很多。", "主題：感測原理｜耗電數字待查"], ["2026-05-17", "光學雷達其實是不是「一根細細的直線」？是不是像「紅光雷射筆」，是一個不管多遠都不會變大的小紅點？", "它不是雷射筆那種小紅點喔！我們的雷達會把前面分成 8×8＝64 格，我們的程式只讀正中間那一格。那一格大約只看 7.5 度的小範圍，很像一支很窄的手電筒，離越遠照到的範圍就越大一點。\n所以在實驗三，雷達裝太低（5 公分）的時候，光照遠了就會先碰到地板，量不準。還有，如果石虎只在光的邊邊，再加上牠是黑色毛毛的、會把光吸走，雷達就收不到反射回來的光，量不到了。", "主題：感測原理"], ["2026-05-17", "光學雷達放在高度 15cm 位置，石虎身高 15.1cm，偵測得到嗎？", "1. 應該測得到，因為石虎的頭剛好碰到雷達看的那條線。不過只碰到一點點，可能一下測得到、一下測不到，我們想之後實際測測看。\n2. 我們在實驗三發現，雷達裝 15 公分、目標只有 11 公分高時，完全測不到！因為我們讀的那一格只看大約 7.5 度，整個從目標頭上過去了。所以雷達要裝在和動物差不多高的地方，不能只靠運氣。", "主題：實驗設計（實驗三）"], ["2026-05-17", "為什麼你想用「光學雷達」來保護石虎？現在很多汽車不都是用「攝影鏡頭（影像辨識）」嗎？", "因為石虎晚上才出來，南投很多山路晚上都沒有路燈，一片黑。攝影機在全黑的時候會看不見，對面來車開遠光燈的時候又會被照到看不清楚。我們在實驗一已經試過，光學雷達是自己發光，所以不管是關燈全黑，還是用手電筒強光照它，都量得很準。所以我們覺得晚上的山路最適合用光學雷達！", "主題：研究方向"], ["2026-05-17", "你的實驗三發現，15公分高的雷達完全照不到 11公分的石虎。可是雷射光不是會擴散嗎？為什麼遠一點還是照不到？", "這是我們最驚訝的發現！我們原本以為光會像手電筒一樣散開，邊邊的光可以掃到石虎。但實驗證明：我們讀的那一格只看大約 7.5 度的小範圍，裝在 15 公分高的時候，整個從 11 公分高的目標頭上過去了（我們叫它「越頂盲區」）；再加上黑色的毛會吸光，就更測不到了。所以一定要降到 10 公分才行！", "主題：實驗設計（實驗三）"], ["2026-05-17", "在你的數據表看到，雷達裝在 5 公分低位的時候，距離 90 公分以後突然全部變成「400 (測不到)」，這是雷達壞掉嗎？", "沒有壞掉喔！400 是雷達「找不到東西」時會出現的數字。雷達裝太低（5 公分）的時候，光越照越遠，還沒照到石虎，下半部就先打到瓦楞紙板地板了。光在地板上亂彈，雷達就量不到了。這也告訴我們，雷達裝太低也很危險！", "主題：實驗設計（實驗三）"], ["2026-05-17", "在寫這台車的程式時，你有遇到什麼最大的困難嗎？你是怎麼解決的？", "那時候我們做完了實驗一和實驗三，最大的困難是「傳回電腦的數字變成亂碼」！一開始我們讓雷達一直量、一直傳，結果兩塊 micro:bit 的資料撞在一起。後來我們在程式裡加了 basic.pause(200)，讓它每次等 0.2 秒再傳，資料就會排好隊一個一個傳，電腦收到的數字就變得很整齊了！", "主題：程式與除錯"], ["2026-05-17", "如果沒有光學雷達可以避開障礙物嗎？", "可以！現在很多掃地機器人和避障車，都是用超音波或攝影機。如果是在白天亮亮的教室，或是遇到平平的紙箱，不用光學雷達也能閃得很好。\n可是我們想保護的是「晚上沒有路燈的山路上、毛是深色的石虎」，這時候另外兩種方法就會有問題：\n1. 攝影機：山路太黑會看不見；對面來車的遠光燈照過來，又會什麼都看不清楚。我們在實驗一試過，光學雷達不怕黑，也不怕強光。\n2. 超音波：超音波是聲音，碰到石虎軟軟的毛會被吸走，彈不回來，車子就會撞上去。而且聲音會像扇子一樣散開，在窄窄的山路很容易碰到旁邊的樹或山壁，車子就會亂煞車。", "主題：真實應用"], ["2026-05-18", "對照3種程式的程式碼", "小車在 5 個實驗裡會換 3 種越來越聰明的程式，可是接在電腦上的那塊「基地台 micro:bit」，從實驗一到實驗五都只有 1 種程式，完全不用改！\n實驗一（光線）和實驗三（高度）：程式長得幾乎一樣，都是量 5 次、算平均、再用無線電傳出去。不一樣的是傳出去的「名字」，實驗三改成 L3_Count，這樣電腦才不會把兩個實驗的數字搞混。\n實驗二（材質）：這個比較不一樣。因為加了超音波，程式要讓兩個感測器「輪流講話」：雷達量一次、等一下、超音波再量一次，資料才不會撞在一起。", "主題：程式與除錯"], ["2026-05-21", "會很常遇到石虎嗎？可以換成人嗎？", "我其實從來沒有親眼看過野生的石虎，這也是我想做這個題目的原因！如果我們現在不想辦法保護牠們，以後我和學弟妹可能真的只能在照片裡看到石虎了。\n老師說可以換成「人」，我們覺得很好，因為車子撞到人也很危險。所以我們的研究變成保護石虎、也保護行人，叫做「零死角全生命守護」。", "主題：研究方向｜★改變研究方向（保護對象加入行人）"], ["2026-05-22", "研究動機可以換成視野死角", "可以！我們已經把研究動機改成以「視野死角」為主了。", "主題：研究方向｜★改變研究方向（主軸改為視野死角）"], ["2026-05-22", "怎麼走路徑會最快、視野死角最小？", "為了「最快」又「死角最少」，我們的程式是這樣想的：\n1. 只要終點在前面，就讓車頭朝北一直直走。直走比較少轉彎，比較快，也比較不會打滑；雷達一直對著前進的方向，死角也最少。\n2. 只有雷達在前面 9 公分內真的看到石虎，車子才會先轉到旁邊閃開。閃到隔壁的路以後，不會一直側著走，會馬上轉回朝北，繼續直走。", "主題：演算法"], ["2026-05-25", "這個實驗的三個核心關鍵字是什麼？", "1. 視野死角：真的車子如果只有一個感測器，轉彎的時候就會有看不到的地方。我們整個研究就是要解決這個問題。\n2. 網格記憶：這是我們的秘密武器！一般的機器人碰到障礙物可能會卡住或亂撞，但我們的程式讓小車有「記憶」，看到石虎或人就會記在黑名單裡，用程式把看不到的地方補起來。\n3. 全生命守護：我們住在南投，常聽到石虎被車撞。我們先用保護石虎來測試，希望以後這套方法也能用在城市裡保護行人。", "主題：研究方向（核心關鍵字）"], ["2026-05-28", "現在的三個關鍵字視野視角網格記憶還有全生命守護之外，一開始老師有說的最短路徑跟光學雷達這個關鍵字還有嗎?", "當然還在！這五個關鍵字剛好可以分成三組：\n硬體：我們用「光學雷達」，去解決車子轉彎時的「視野死角」。\n程式：我們用 MakeCode 的 Python 寫了「網格記憶」，再加上找「最短路徑」的方法，讓車子一邊閃石虎，一邊自己找最近的路。\n想保護的對象：硬體和程式加起來，就是我們想做的「全生命守護」，保護石虎，也保護行人！\n（後來我們把找路的方法升級了：不只算曼哈頓距離，而是算出繞過障礙物「真正要走幾步」。）", "主題：研究方向（核心關鍵字）"], ["2026-05-28", "什麼是曼哈頓距離？", "曼哈頓距離也叫「計程車距離」。\n想像一座城市（像美國紐約的曼哈頓），街道像棋盤一樣方方正正。你開計程車從 A 點到 B 點，不能像小鳥一樣直接飛過大樓，只能沿著街道直走、橫走。\n你走過的「橫的距離」加上「直的距離」，就是曼哈頓距離。\n後來我們的程式又升級了：曼哈頓距離不會管中間有沒有障礙物，所以我們改成從下一格開始，一圈一圈往外找，算出繞過障礙物「真正要走幾步」。", "主題：演算法"], ["2026-05-28", "為什麼不用一般的直線距離（歐幾里得距離）來算？」", "因為我們的 24 宮格地圖就像棋盤，小車只能直走或橫走，不能斜著走。曼哈頓距離就是「橫的差幾格」加上「直的差幾格」，像計程車在街道上開一樣。如果用直線距離，會算出 4.24 格這種有小數點的數字，可是小車每次只能走一整格，所以沒有用。\n後來我們又發現一個問題：曼哈頓距離不管中間有沒有障礙物。所以現在的程式改成從下一格開始「一圈一圈往外找」，算出繞過障礙物真正要走幾步，小車就不會被騙進死路了。", "主題：演算法"], ["2026-05-28", "實驗五-A，超音波在 40cm/s 高速時提早撞牆或煞車，為什麼低速（20、30cm/s）時就沒事？這跟速度有關係嗎？", "我們覺得和速度很有關係！速度慢的時候，超音波發出去的聲音有時間彈回來。可是速度開到 40 cm/s（最快）的時候，車子衝得太快，超音波的聲音會像扇子一樣散開，碰到左右只差 0.5 公分的山壁又馬上彈回來，程式就以為前面有障礙物，結果太早煞車或太早轉彎去撞牆。這也證明了超音波的聲音會散開，速度越快越危險！", "主題：實驗設計（實驗五-A）"], ["2026-05-29", "每一台車可以用它們專屬的網格記憶來標記自己的車體視野死角的範圍?", "這個想法好酷！在電腦遊戲裡這叫做「戰爭迷霧」。因為我們的雷達只能看前面，左右和後面都看不到。\n我們未來想這樣升級：幫小車多準備一本「還沒看過的地方」筆記本，把沒看過的格子打上問號。如果小車想走去有問號的格子，就要先轉頭看一下，確定安全才走。這樣就更接近「零死角」了！", "主題：演算法（未來升級）"], ["2026-05-29", "可以用網格記憶記住障礙物在哪裡嗎?", "可以！我們把小車的大腦想成有一本「黑名單筆記本」（程式裡叫 bad_x 和 bad_y）。它分成三個步驟：\n1. 眼睛看到危險：小車往前走的時候，如果雷達看到前面有石虎，就知道「前面那一格有危險」！\n2. 寫進筆記本：大腦會算出石虎在哪一格（例如 X 是 1、Y 是 2），然後把 (1,2) 寫進黑名單。就像在腦袋裡的地圖上畫一個大大的紅色叉叉！\n3. 走之前先看筆記：小車每次要走下一步之前，都會先翻筆記本檢查。只要那一格被畫了叉叉，就算是捷徑也不走，會自己轉彎找別條路。", "主題：演算法"], ["2026-06-07", "麥昆小車最多可以安裝幾個「光學雷達」?", "我們用的是麥昆 Plus V3，最多可以裝四顆光學雷達。", "主題：感測原理"], ["2026-06-07", "目前道路上的駕駛員有很多可能因為前方A柱在轉彎的過程擋到了視野而撞上行人。我們有沒有機會在小車的前方左邊跟右邊各裝一個光學雷達來解決駕駛人A柱擋住的視野死角。 \n", "可以！我們可以在小車前面裝「三顆」光學雷達：正前方一顆是主雷達，左前和右前的 A 柱位置各一顆當輔助雷達。三顆一起看，就像一個 180 度的半圓形防護罩。", "主題：研究方向｜★改變研究方向（→ 實驗六：三雷達克服 A 柱死角）"], ["2026-06-07", "可以做到「停下來等行人通過，再繼續走」嗎？", "可以！這叫做「動態禮讓」，就像大人考駕照時學的「停、看、聽」：看到行人就停下來，等行人走過去了再繼續開。", "主題：研究方向｜★改變研究方向（→ 實驗六：動態禮讓）"], ["2026-06-14", "現在都有 2D、3D 的光學雷達了，為什麼你們只用 1D（單點）的光學雷達？是不是設備太低階？", "其實我們的雷達可以看 8×8＝64 個點，不是只有一個點！但是我們故意只讀正中間那一點。因為 64 個點全部用上的話，避障會變得太簡單。我們想挑戰：雷達看到的東西很少的時候，能不能靠程式的「網格記憶」和找路的方法，把看不到的地方補起來。", "主題：感測原理"], ["2026-06-15", "五大核心關鍵字", "邏輯鏈：目標 ➡️ 硬體 ➡️ 痛點 ➡️ 軟體 ➡️ 成果\n路徑規劃 (Path Planning) —— 系統的最初目標\n光學雷達 (LiDAR) —— 執行任務的探路之眼\n視野死角 (Blind Spot) —— 轉彎時發現的致命危機\n網格記憶 (Grid Memory) —— 記住危險的 AI 大腦\n動態避障 (Dynamic Obstacle Avoidance) —— 完美閃避的最終成果", "主題：研究方向（核心關鍵字）"], ["2026-06-15", "ADAS雙系統與三雷達融合策略", "我們用實驗四量到的煞車滑行距離，把 15 公分當作「要做決定的距離」。\n在 15 公分外就看到東西：提早煞車，停下來等它離開（動態禮讓）。這個我們已經做到了！\n如果東西在 15 公分內才突然從死角衝出來，煞車可能來不及。我們以後想讓車子自動轉方向閃開，就像真車的「自動緊急轉向」。不過這個功能還沒有寫進程式，是我們下一步想做的。", "主題：真實應用（自動轉向是未來想做的）"], ["2026-08-16", "障礙物隨機生成，地圖覆蓋，只留下起點跟終點", "我們做到了！就是網站上的「迷霧探測對決」遊戲。\n按下「隨機生成新地圖」，電腦會在 24 宮格裡隨便放障礙物，而且一定有路可以走到終點。地圖會被蓋起來，只看得到起點和終點，要走到旁邊，那一格才會亮起來，就像雷達一樣。\n可以自己用方向鍵走，也可以讓 AI 大腦走，最後比比看誰走的步數比較少。", "主題：演算法（迷霧遊戲）"], ["2026-08-16", "人類規劃出來的路徑，跟光學雷達規劃出來的路徑還有超音波怎麼測量不一樣", "我們用三種方法來比比看：\n1. 人：靠眼睛看，看不到就以為安全。人開車常常會選「看起來最近」的路走。可是眼睛有死角（像汽車的 A 柱），石虎走進死角沒看到，就會以為路是通的，直接撞上去。就像我們的迷霧遊戲，人常常一直往前衝，撞到牆才發現走錯，只好一直倒退，所以走的步數比較多。\n2. 光學雷達＋網格記憶：雷達射出很窄的光，算光彈回來的時間，量得很準，也不怕黑和強光。更厲害的是網格記憶：雷達看到一次石虎，大腦就會在那一格畫紅色叉叉。就算轉彎時雷達被車身擋住，大腦還是記得那裡危險，會提早換一條安全的路，步數最少也最安全！\n3. 超音波：發出像扇子一樣散開的聲音，聽回音來量距離。可是聲音會散開，也會被毛吸走。我們發現遇到毛毛的石虎，聲音彈不回來；在 11 公分的窄路上，散開的聲音又會碰到兩邊的山壁，讓車子亂煞車或撞牆。所以我們最後選了光學雷達。", "主題：演算法"], ["2026-09-03", "研究動機是什麼?", "【研究動機】\n我們在餐廳看到送餐機器人會自己閃開障礙物，很好奇它是怎麼找到「最短的路」的，所以就用麥昆小車和光學雷達來研究避障和找路。可是測試的時候，我們發現一個大問題：車子轉彎時，前面那顆雷達只能看前面，車子旁邊就有看不到的「視野死角」。\n這讓我們想到，南投的山路又暗又窄，石虎常常因為駕駛看不到而被車撞；在一般馬路上，車子轉彎時「A 柱」擋住的地方，也常常撞到過馬路的行人。所以我們決定不只要閃開不會動的障礙物，還要做出能保護石虎和行人的「零死角全生命守護」小車。", "主題：研究方向"], ["2026-09-03", "研究目的是什麼?", "【研究目的】\n1. 硬體：用實驗比比看，光學雷達是不是比超音波更能看到深色、毛毛的石虎。我們還在車頭裝了左、中、右三顆光學雷達，做出 180 度的防護罩，補上 A 柱死角。\n2. 程式：幫小車做一個有「網格記憶」的大腦。遇到走不通的路，就把危險的位置寫進黑名單，再自己算出新的路。\n3. 最後的目標：讓小車學會「停、看、聽」。轉彎時如果在死角看到行人（鋼彈模型），就馬上煞車等待，等行人完全走開了，才安全地繼續開。", "主題：研究方向"], ["2026-09-03", "這次的獨立研究兩兄弟如何分工合作？", "很多事情我們都是一起做的，不過每個人有比較常做的部分。\n\n我是四年級的秉宸。麥昆小車是我親手組裝的。我在車頭多裝了左邊和右邊兩顆光學雷達，還把它們往外轉大約 45 度，變成「外八字」，這樣才能看到 180 度。實際測試的時候，都是我負責啟動和控制小車。\n\n我是六年級的秉澔。弟弟把雷達（眼睛）裝好以後，我用 MakeCode 的 Python 寫程式。我做了「網格座標記憶」和找路的方法，讓車子遇到死路會把危險的位置記在黑名單裡，然後自己找別條路。\n最難的是轉彎太慢、撞到行人的那個 Bug。我把程式改成用 input.running_time() 這個「碼表」來算時間，才做出會「停、看、聽」的動態禮讓。最後測試的時候，我拿著鋼彈模型當過馬路的行人，和弟弟一起完成實驗！", "主題：研究方向"], ["2026-09-07", "研究問題", "1. 光學雷達和超音波，誰比較能在黑夜裡，或是遇到「黑色毛皮的石虎」時看得最清楚？\n答案： 光學雷達完勝！\n實驗證明： 實驗一發現，就算關燈全黑，光學雷達還是量得很準，完全不怕黑。實驗二對決的時候，面對模擬石虎的「黑色絨毛玩偶」，超音波因為絨毛會「吸收聲音」，在 30 公分就量不到了！但是光學雷達在 30 到 60 公分這段最重要的煞車距離裡，還是量得很準。\n\n2. 雷達要裝多高才不會漏看東西？車子開越快，需要提早多遠煞車才安全？\n答案： 雷達最好裝 10 公分高；車速開到最快的 40 cm/s，要在 17.06 公分外就開始煞車！\n實驗證明： 實驗三告訴我們，雷達裝 15 公分高時，光會直接從目標頭頂飛過去（越頂盲區）；裝太低在 5 公分，光又會太早打到地板（觸地雜訊），所以對齊目標的 10 公分最剛好。實驗四發現，速度到 40 cm/s 時，煞車會往前滑 7.06 公分。為了更安全，我們再多加 10 公分的緩衝，算出至少要在 17.06 公分外就開始煞車。\n\n3. 遇到「走不通的死路」時，怎麼讓小車的大腦記住危險，自己找出「最短又安全」的路線？\n答案： 靠我們寫的「網格記憶」和找路的方法！\n實驗證明： 在實驗五-B 的 24 宮格裡，程式用 visited 陣列記住走過的地方，遇到危險就寫進黑名單。大腦會把「走過太多次的扣分」加上「離終點還要走幾步」一起算（一開始用曼哈頓距離，後來升級成繞過障礙物的真正步數）。當它發現在原地打轉的分數太高，就知道「退後找新路」才是最好的選擇，自己退出來，再找出新的最短路線！\n\n4. 轉彎時怎麼消除可怕的「A柱死角」？怎麼讓車子看見鋼彈行人時，能自己學會「停、看、聽」禮讓他們？\n答案：硬體上我們裝了「外八字三眼雷達」，程式上我們用「碼表」來做動態禮讓！\n實驗證明： 實驗六裡，弟弟把左、右兩顆雷達往外轉大約 45 度，做出 180 度的防護罩，A 柱死角就看得到了。哥哥為了不讓程式卡住、來不及煞車，改用 micro:bit 的 input.running_time() 碼表來算時間。只要雷達在死角看到鋼彈，車子就馬上煞車亮紅燈，停在那裡「停、看、聽」，等鋼彈走開了才亮綠燈繼續轉彎！", "主題：研究方向"], ["2026-09-14", "在不同測量距離 (30~150 cm) 下，光學雷達與超音波感測器面對「黑色絨毛材質」時，有效偵測距離 (cm) 與誤差 (cm) 有何差異？", "光學雷達贏了！面對深色毛毛的材質，超音波在 30 公分就因為聲音被吸走而量不到。光學雷達在 30～60 公分這段最重要的煞車距離裡，還是量得很準。", "主題：評審模擬題"], ["2026-09-14", "針對 12 cm 高的模擬石虎，雷達最佳安裝高度 (cm) 為何？當車速達 40 cm/s 時，滑行距離 (cm) 會如何影響安全預警距離 (cm) 的設定？", "雷達最好裝 10 公分高！我們試過，裝 15 公分光會從目標頭上飛過去（越頂盲區），裝 5 公分光會太早打到地板（觸地雜訊）。還有，車速 40 cm/s 時，煞車會往前滑 7.06 公分；我們再多加 10 公分當安全距離，所以要在 17.06 公分外就開始煞車才安全。", "主題：評審模擬題"], ["2026-09-14", "在 24 宮格 (格) 地圖中遇到死胡同，AI 大腦如何利用座標記憶與曼哈頓距離，自主計算並規劃出最低分數的避障路徑？", "小車開進死路時，大腦會把危險的位置寫進黑名單。接著，它把「走過幾次的扣分」加上「離終點還要走幾步」（繞過障礙物算出來的真正步數）。如果發現在原地打轉的分數太高，它就會自己倒退，離開死巷子，再算出一條最短、最安全的新路。", "主題：評審模擬題"], ["2026-09-14", "將兩側雷達以向外 45 度 (°) 安裝後，如何利用絕對時間碼表解決系統延遲 (s)，將動態禮讓的反應時間縮短至毫秒 (ms) 等級？", "硬體上，左右兩顆雷達往外轉 45 度，加上前面那顆，三顆一起看就是 180 度，A 柱死角就看得到了。程式上，我們把會卡住大約 1 秒的跑馬燈拿掉，改用「碼表」算馬達要轉多久（大約 1 秒，程式裡是 1050 毫秒）。現在只要看到鋼彈行人，車子馬上就會煞車亮紅燈，等行人走過去才繼續轉彎！", "主題：評審模擬題"], ["2026-09-14", "秉宸提問哥哥你好，我看到你一開始測試轉彎的時候，車子笨笨的，直接把盲區裡的鋼彈撞飛了！請問你的程式是『卡』在哪裡？後來怎麼修好的？", "評審好！因為原本的程式會讓車子顯示「跑馬燈英文字」，車子的大腦忙著顯示字，動作慢了 1 秒，就來不及煞車撞上去了！後來我把跑馬燈拿掉，改用 micro:bit 的「碼表」來算馬達要轉多久。現在只要一看到鋼彈，車子馬上就會煞車，一點都不會卡了！", "主題：評審模擬題"], ["2026-09-14", "秉宸評審問：\n「我看車子開進 24 宮格的死路時，居然沒有在裡面一直撞牆，還會自己乖乖倒退出來。請問你是怎麼讓車子變這麼聰明的？」", "因為我幫車子做了一個「有記憶的大腦」！只要它開進死路，就會把那個危險的地方記在黑名單裡。而且大腦會算分數，如果在死路裡一直轉來轉去，分數就會被扣很多，它就知道「退後找別條路」才是最好的選擇，所以就自己退出來了！", "主題：評審模擬題"], ["2026-09-14", "秉宸評審問：\n「我們的作品叫做『全生命守護』。請問當車子在轉彎死角看到鋼彈路人時，你是怎麼讓它乖乖在原地『等』，而不是永遠停在那邊當機的？」", "我寫了一個會「停、看、聽」的程式！車子看到鋼彈會馬上煞車，亮紅燈。這時候車子沒有當機喔，它的雷達還一直在看前面。等鋼彈走過去、完全離開死角了，車子才會亮綠燈，繼續把彎轉完！", "主題：評審模擬題"], ["2026-09-14", "秉宸評審問：\n「我在做硬體實驗的時候，辛苦幫你量出車子開最快時，煞車會往前滑行 7.06 公分。請問身為軟體工程師，你怎麼把這個數字用在你的程式裡保護大家？」", "弟弟量出來的數字超重要！只設定 7.06 公分太危險了，所以我在滑行距離上再加 10 公分的「安全距離」，變成 17.06 公分寫進程式。只要雷達看到障礙物比 17.06 公分還近，大腦就會提早煞車或閃開，這樣就不會撞到了！", "主題：評審模擬題"], ["2026-09-16", "麥昆小車接收程式畫面的英文代表什麼?", "Speed 是小車現在設定的速度，Trig 是開始煞車那一刻的距離，Slide 是煞車以後車子又往前滑了多遠。", "主題：操作說明"], ["2026-09-16", "實驗六-動態禮讓，請問前方光學雷達和左前右三個光學雷達，如何啟用?", "B 鍵只打開前面的雷達；A 和 B 一起按，會打開前、左、右三顆雷達。", "主題：操作說明"], ["2026-09-18", "實驗四接收到的數據，代表什麼意思？", "--- EXP 4 --- ：實驗四開始了\nSpeed: 150 ：測試的速度（馬達的力氣設成 150）\nTrig: 14.8 ：雷達看到障礙物、開始煞車那一刻的距離（公分）\nSlide: 3.2 ：煞車以後，車子因為慣性又往前滑了多遠（公分）", "主題：操作說明"], ["2026-09-30", "光學雷達在幾公分會偵測到模擬小人", "我們的程式設定是：前方雷達在 15 公分內、左右雷達在 25 公分內看到鋼彈小人，就會馬上煞車（實驗六）。但雷達其實看得更遠：官方規格是 2 公分到 3.5 公尺。我們算過，程式讀的中心點視角約 7.5°，鋼彈寬 7 公分，大約在 53 公分以內鋼彈可以塞滿雷達的視線，所以我們預測 50 公分以內最容易偵測到。我們正在用「鋼彈偵測距離量測」程式，把鋼彈放在 10～100 公分各量 5 次，量完會把真正的數字補上。（初步答案，待實測更新）", "主題：感測原理｜待補：鋼彈實測數據（實驗六補充分頁）"], ["2026-09-30", "他有效偵測到的距離是幾公分?\n", "要看目標是什麼：白色紙板到 150 公分都很準；黑色絨毛（模擬石虎）在 60 公分內最準，90 公分開始亂跳，120 公分以上幾乎測不到；雷達裝 10 公分高時，90 公分內 100% 測得到，150 公分只剩 40%。所以我們把「有效偵測距離」定在 60 公分以內，避障的觸發距離（9、15、17.06、25 公分）都在這個範圍裡。鋼彈小人的有效距離正在實測。（初步答案，待實測更新）", "主題：感測原理｜依據實驗二、實驗三；鋼彈待補"], ["2026-09-30", "模擬跟真實的差距差多少？", "我們的小車長 11.5 公分，真的汽車大約 4.5 公尺，差不多是 1:39。用「幾個車長」來比比看：小車開 40 cm/s，煞車只滑 7.06 公分，不到一個車長；真的汽車開時速 50 公里，再加上駕駛看到以後 2 秒才踩煞車，大約要 42 公尺才停得住，差不多是 9 個車長。\n我們的雷達最遠大約看 3.5～4 公尺，裝在真的車上只能提早大約 0.3 秒警告，比人反應的時間還短很多。所以我們的小車證明了「方法和程式的想法」是對的，但是真的要上路，要用看得到 100 公尺以上的汽車光學雷達。\n（反應 2 秒、路面摩擦係數 0.7 是大家常用的估計數字。）", "主題：真實應用｜比例 1:39；真車數據為估算"]]</script>

<script>
(function () {
  var URL = 'https://docs.google.com/spreadsheets/d/13gkJgF3i0j1yPZTgs6Z5I28JxsanNAGIRpXyR6V_tt8/export?format=csv&gid=1501050832';
  var GAS = 'https://script.google.com/macros/s/AKfycbz1E-EzMVsvcW6Uf2f-351kj2aBKEFiviIbz39ZzRO-WLYBRT7zTUmoOFeak1QRgjOs2g/exec';
  var rows = JSON.parse(document.getElementById('qa-fb').textContent).slice(1);
  var topic = 'all', word = '';
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function info(r) {
    var d = r[3] || '', parts = d.split('｜'), main = parts[0], t = '其他';
    var m = main.match(/主題：([^（(｜]+)/);
    if (m) t = m[1].trim();
    return { topic: t, sub: (main.match(/（([^）]+)）/) || [])[1] || '', notes: parts.slice(1), star: d.indexOf('★') > -1 };
  }
  function hi(text) {
    var h = esc(text).replace(/\n/g, '<br>');
    if (!word) return h;
    var w = esc(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return h.replace(new RegExp(w, 'g'), '<mark>$&</mark>');
  }
  function date(d) { var p = d.split('-'); return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : d; }
  function render() {
    var list = document.getElementById('qa-list'), n = 0, html = '';
    rows.forEach(function (r) {
      if (!r[0] || !r[1]) return;
      var f = info(r);
      if (topic === 'star' ? !f.star : (topic !== 'all' && f.topic !== topic)) return;
      if (word && (r[1] + r[2]).indexOf(word) < 0) return;
      n++;
      var tags = '<span class="tag exp">' + esc(f.topic) + (f.sub ? '・' + esc(f.sub) : '') + '</span>' +
        f.notes.map(function (x) { return '<span class="tag ' + (x.indexOf('★') > -1 ? 'star' : 'fail') + '">' + esc(x.replace('★', '★ ')) + '</span>'; }).join('');
      html += '<div class="qa"><p class="q">' + hi(r[1].trim()) + '</p>' +
        (r[2] && r[2].trim() ? '<p class="a">' + hi(r[2].trim()) + '</p>' : '<p class="a muted">（我們還在想，之後補上）</p>') +
        '<div class="d"><span>' + date(r[0]) + '</span></div><div class="tags">' + tags + '</div></div>';
    });
    list.innerHTML = html || '<p>找不到符合的問題。</p>';
    document.getElementById('qa-count').textContent = '共 ' + n + ' 個問題';
  }
  function chips() {
    var seen = {}, order = [];
    rows.forEach(function (r) { if (!r[0]) return; var t = info(r).topic; if (!seen[t]) { seen[t] = 0; order.push(t); } seen[t]++; });
    var bar = document.getElementById('qa-chips');
    bar.innerHTML = '<button type="button" data-t="all" aria-pressed="true">全部</button><button type="button" data-t="star" aria-pressed="false">★ 讓研究轉彎的問題</button>' +
      order.map(function (t) { return '<button type="button" data-t="' + esc(t) + '" aria-pressed="false">' + esc(t) + '（' + seen[t] + '）</button>'; }).join('');
  }
  document.getElementById('qa-chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    topic = b.getAttribute('data-t');
    this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    render();
  });
  document.getElementById('qa-search').addEventListener('input', function () { word = this.value.trim(); render(); });
  chips(); render();
  function load() {
    fetch(URL).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
      var all = window.parseCSV(t);
      if (all.length > 1 && all[0][0] === '日期') { rows = all.slice(1); chips(); render(); }
    }).catch(function () {});
  }
  load();

  var form = document.getElementById('add');
  try { form.elements.date.value = new Date().toISOString().slice(0, 10); } catch (e) {}
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var d = form.elements.date.value, q = form.elements.question.value.trim(), a = form.elements.answer.value.trim();
    var msg = document.getElementById('add-msg');
    if (!d || !q) { msg.textContent = '請記得選日期，也要寫老師的問題喔！'; return; }
    var btn = form.querySelector('button'); btn.disabled = true; btn.textContent = '傳送中…';
    fetch(GAS, { method: 'POST', body: JSON.stringify({ date: d, question: q, answer: a }), mode: 'no-cors' })
      .then(function () { msg.textContent = '送出成功！大約一分鐘後會出現在上面的列表。'; form.elements.question.value = ''; form.elements.answer.value = ''; setTimeout(load, 60000); })
      .catch(function () { msg.textContent = '連線失敗，請再試一次。'; })
      .then(function () { btn.disabled = false; btn.textContent = '送出紀錄'; });
  });
})();
</script>
</body>
</html>
